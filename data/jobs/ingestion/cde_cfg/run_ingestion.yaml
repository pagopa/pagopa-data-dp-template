name: ${dp.name}-${job.name}-${env.name}
type: spark
applicationFile: launcher.py
pyFiles:
  - ${build.wheel}
mountResources:
  - ${dp.name}-${job.name}-${env.name}
env:
  ENV: ${env.name}
workloadCredentials: ${env.credentials}
args:
  - --database=${env.databases.data}
  - --input-database=${env.databases.inputs}
sizing:
  driverCores: 1
  driverMemory: 2g
  executorCores: 2
  executorMemory: 4g
  maxExecutors: 4
