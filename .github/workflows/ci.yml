name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on:
      - codebuild-${{ vars.CODEBUILD_RUNNER_PROJECT }}-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - uses: actions/checkout@v4

      # Niente actions/setup-python: i suoi interpreti non partono sull'immagine amazonlinux del runner.
      - name: Prepara venv
        run: |
          python3 --version
          python3 -m venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          .venv/bin/python -m pip install --upgrade pip

      - name: Installa
        run: make install

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Build dei wheel
        run: make build
